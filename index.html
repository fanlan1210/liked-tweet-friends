<!DOCTYPE html>
<html lang="zh">

<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>我的推特互動排名</title>

  <!-- Meta tags for SEO and social sharing -->
  <link rel="canonical" href="" />
  <meta name="description" content="在裝置端分析您的 tweets.js 檔案，查看近期最常互動的朋友" />
  <meta property="og:title" content="我的推特互動排名" />
  <meta property="og:description" content="在裝置端分析您的 tweets.js 檔案，查看近期最常互動的朋友" />
  <!--meta
      property="og:image"
      content=""
    /-->
  <meta name="twitter:card" content="summary" />

  <!-- Import the webpage's stylesheet -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Akshar&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />

  <!-- Import the webpage's javascript file -->
  <script src="https://unpkg.com/vue@3"></script>
  <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/material-icons@1.13.14/iconfont/material-icons.min.css">

  <script src="script.js" defer></script>
</head>

<body class="bg-primary min-h-screen relative" id="app">
  <!-- Settings Button -->
  <button @click="showSettings = true"
    class="absolute top-4 right-4 p-2 text-white/70 hover:text-white transition-colors z-20 flex items-center justify-center">
    <svg xmlns="http://www.w3.org/2000/svg" enable-background="new 0 0 24 24" height="32" viewBox="0 0 24 24"
      width="32">
      <g>
        <path d="M0,0h24v24H0V0z" fill="none" />
        <path fill="currentColor"
          d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z" />
      </g>
    </svg>
  </button>

  <div v-show="!isResulted">
    <div class="max-w-2xl mx-auto p-8">
      <p class="text-2xl text-center pb-8">
        我的推特互動排名
      </p>
      <div class="w-full flex justify-center">
        <div class="flex flex-col items-center gap-4">
          <p class="text-white mb-2 leading-relaxed">
            請選取您的 <code>tweets.js</code> 檔案 (位於 X / Twitter 封存檔的 data 資料夾中)
            <small class="underline pl-2"><a href="https://x.com/settings/download_your_data"
                target="_blank">下載/取得封存檔</a></small>
          </p>
          <input type="file" accept=".js" @change="handleFileUpload" class="block w-full text-sm text-slate-500
              file:mr-4 file:py-2 file:px-4
              file:rounded-full file:border-0
              file:text-sm file:font-semibold
              file:bg-violet-50 file:text-violet-700
              hover:file:bg-violet-100
            " />
        </div>
      </div>
    </div>
  </div>
  <transition>
    <div v-if="isResulted" class="pb-20">
      <div class="max-w-2xl mx-auto p-8 pb-4 bg-primary" id="capture-area">
        <div class="text-primary p-4 text-center">
          <p class="text-2xl">
            我的推特互動排名<!--br>
              @{{ me }} -->
          </p>
          <p class="text-xl">近期最常互動 (回覆與提及)</p>
        </div>
        <div class="bg-lightgray mb-2 p-4 rounded-3xl grid grid-cols-1 gap-4">
          <div v-for="(friend, index) in topFriends" :key="friend.screen_name"
            class="bg-error p-4 rounded-3xl text-white">
            <div class="flex justify-center p-2 flex-wrap w-full items-center">
              <div v-if="settings.displayRankOrderNumber" class="text-4xl font-bold mr-4 opacity-50">#{{ index + 1 }}
              </div>
              <div v-if="friend.img && friend.img !== '#'" class="basis-16 flex-initial mr-4">
                <img class="object-scale-down rounded-full w-16 h-16" :src="friend.img">
              </div>
              <div class="text-left flex flex-col justify-center flex-1" style="line-height: 1.2;">
                <p class="text-2xl font-medium m-0 p-0">{{ friend.username }}</p>
                <p class="text-xl font-medium opacity-80 m-0 p-0 leading-tight">
                  <a :href="'https://twitter.com/' + friend.screen_name" target="_blank"
                    style="text-decoration: none; color: inherit;">
                    @{{ friend.screen_name }}
                  </a>
                </p>
                <p v-if="settings.displayInteractionCount" class="text-sm opacity-70 mt-1 m-0 p-0 leading-tight">{{
                  friend.count }} 次互動</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-center flex-wrap gap-4 mt-4 px-4">
        <button @click="captureScreenshot"
          class="bg-white text-blue-500 font-bold py-3 px-6 rounded-full shadow-lg hover:bg-gray-100 transition-colors flex items-center justify-center gap-2">
          <span class="material-icons">download</span>
          將結果儲存為圖片
        </button>
        <button v-if="canShare" @click="shareNative"
          class="bg-indigo-500 text-white font-bold py-3 px-6 rounded-full shadow-lg hover:bg-indigo-600 transition-colors flex items-center justify-center gap-2">
          <span class="material-icons">share</span>
          分享結果
        </button>
      </div>
    </div>
  </transition>


  <div class="h-100 absolute inset-x-0 bottom-0 pointer-events-none">
    <p class="bg-darkprimary text-center text-primary pointer-events-auto">
      ［頁面測試中］
    </p>
    <p class="bg-darkprimary text-center text-primary pointer-events-auto">
      目前查詢範圍為近三個月，分析均在裝置端完成
    </p>
  </div>

  <!-- Settings Modal -->
  <div v-if="showSettings"
    class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity"
    @click.self="showSettings = false">
    <div class="bg-[#2c2c2c] rounded-3xl p-8 w-96 max-w-[90%] shadow-2xl border border-gray-700">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-white">設定</h2>
        <button @click="showSettings = false" class="text-gray-400 hover:text-white transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
            class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="space-y-6">
        <div class="flex items-center justify-between">
          <span class="text-lg text-gray-200 font-medium">顯示互動次數</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" v-model="settings.displayInteractionCount" class="sr-only peer">
            <div
              class="w-14 h-7 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-indigo-500">
            </div>
          </label>
        </div>

        <div class="flex items-center justify-between">
          <span class="text-lg text-gray-200 font-medium">顯示排名序號</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" v-model="settings.displayRankOrderNumber" class="sr-only peer">
            <div
              class="w-14 h-7 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-indigo-500">
            </div>
          </label>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
